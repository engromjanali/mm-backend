<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found · Mess Pilot</title>
  <style>
    :root {
      --primary: #176d58;
      --bg: #f5f6f8;
      --surface: #ffffff;
      --text: #252b32;
      --text-muted: #626b77;
      --border: #d9dee5;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #69c7a5;
        --bg: #14171a;
        --surface: #1e2227;
        --text: #e6e9ed;
        --text-muted: #a8b0bb;
        --border: #333a42;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 48px 36px;
      max-width: 480px;
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 12px; }
    p { color: var(--text-muted); margin-bottom: 24px; }
    a.btn {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Page Not Available</h1>
    <p>This content page hasn't been published yet. Please check back later.</p>
    <a href="/privacy-policy/" class="btn">View Privacy Policy</a>
  </div>
</body>
</html>
